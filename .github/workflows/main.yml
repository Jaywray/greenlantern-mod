name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Desktop Code Files
      run: |
        echo "Extracting mod source files into separate workspace directory..."
        # Extract files into a dedicated subdirectory to preserve your desktop pathing structure
        unzip -q "GreenLanternMod (5).zip" -d extracted_mod
        
        # Locate the exact directory containing build.gradle inside the zip file dynamically
        TARGET_DIR=$(find extracted_mod -name "build.gradle" -exec dirname {} \;)
        echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
        
        echo "Copying the modified build.gradle to the project folder..."
        cp build.gradle "$TARGET_DIR/"
        
        echo "Project directory verified at: $TARGET_DIR"
        ls -la "$TARGET_DIR"

    - name: Ensure Gradle Wrapper Exists
      run: |
        cd "${{ env.PROJECT_DIR }}"
        if [ ! -f ./gradlew ]; then
          echo "Generating Gradle 8.8 Wrapper inside the project folder..."
          gradle wrapper --gradle-version 8.8
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
