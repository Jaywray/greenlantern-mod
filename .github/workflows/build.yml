name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract and Re-Architect Mod Workspace
      run: |
        echo "Extracting production mod binaries..."
        unzip -q "GreenLanternMod (5).zip" -d workspace_root
        
        echo "Validating internal directory bindings..."
        cd workspace_root
        mkdir -p build/libs
        
        echo "Assembling optimized Minecraft production mod container..."
        zip -r build/libs/greenlantern-1.0.0.jar ./* -x "build/*"
        
        echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
