name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        # REPLACE 'your-subfolder-name' with the actual folder name your mod files live in
        cache-dependency-path: |
          your-subfolder-name/**/*.gradle*
          your-subfolder-name/gradle/wrapper/gradle-wrapper.properties

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./your-subfolder-name/gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon
      working-directory: your-subfolder-name

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: your-subfolder-name/build/libs/*.jar
        if-no-files-found: error
