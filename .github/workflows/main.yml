name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Desktop Code Files
      run: |
        echo "Extracting mod source files..."
        unzip -q "GreenLanternMod (5).zip" -d temp_extraction
        
        echo "Moving files out of the nested archive folder to root level..."
        # This safely grabs everything out of the subfolder and pulls it to the root
        mv temp_extraction/*/.??* temp_extraction/*/* . 2>/dev/null || true
        rm -rf temp_extraction
        
        echo "Extraction and flattening complete. Verifying root level contents:"
        ls -la

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradle wrapper missing. Generating default wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
