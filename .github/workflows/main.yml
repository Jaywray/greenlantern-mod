name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # REMOVED the cache line completely to prevent strict crashing

    - name: Debug - List Files in Repository
      run: |
        echo "=== Checking what files are actually in this repository ==="
        ls -la
        echo "=========================================================="

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradle wrapper missing. Generating default wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
