    - name: Force Generate and Compile 1.21.1 Mod Environment
      run: |
        find . -type d -name "build" -exec rm -rf {} + || true
        
        SRC_DIR=$(find . -path "*/src/main" -type d | head -n 1)
        if [ -z "$SRC_DIR" ]; then
          SRC_DIR=$(find . -name "java" -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: Could not find code source folders!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SRC_DIR")
        else
          PROJECT_ROOT=$(dirname $(dirname "$SRC_DIR"))
        fi
        
        echo "Targeting true project root folder at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        rm -f build.gradle settings.gradle || true
        
        gradle init --type basic --dsl groovy --no-daemon --overwrite
        ./gradlew wrapper --gradle-version 8.10 --no-daemon
        
        # Dropping a clean Java configuration file that points explicitly to the NeoForge release mirror maps
        cat << 'EOF' > build.gradle
        plugins {
            id 'java'
            id 'eclipse'
            id 'idea'
        }
        version = '1.0.0'
        group = 'com.example.greenlantern'
        base { archivesName = 'greenlantern' }
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
        
        repositories {
            mavenCentral()
            maven { url 'https://maven.neoforged.net/releases' }
        }
        
        dependencies {
            // Direct jar dependency target alignment
            compileOnly "net.neoforged:neoforge:21.1.65"
        }
        
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        EOF
        
        cat << 'EOF' > settings.gradle
        rootProject.name = 'greenlantern'
        EOF
        
        # Compile your mod natively right inside its true home directory
        chmod +x gradlew || true
        ./gradlew clean build --no-daemon
