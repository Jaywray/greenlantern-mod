name: Build Minecraft Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Automatically finds whatever zip file you uploaded and extracts it completely before running the build
      - name: Automatically Locate and Unzip Mod Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found, assuming repository contains raw files directly."
          else
            echo "Found zip archive at: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Automatically scans your repository to locate your gradlew file and compiles the mod code
      - name: Locate and Compile Mod with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: Could not find gradlew anywhere in the repository even after unzipping!"
            exit 1
          fi
          MOD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project folder at: $MOD_DIR"
          cd "$MOD_DIR"
          chmod +x gradlew || true
          ./gradlew clean build --no-daemon

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Playable-Mod-Jar
          path: "**/build/libs/*.jar"
