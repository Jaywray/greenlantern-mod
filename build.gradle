plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.greenlantern'

base {
    archivesName = 'greenlantern'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Basic structural compilation bridges bypassing complex plugin locks
}

// FORCE GRADLE TO PACK YOUR CODE AND ASSETS INTO THE JAR
jar {
    from sourceSets.main.output
    from sourceSets.main.allSource
    
    manifest {
        attributes([
            "Specification-Title"     : "greenlantern",
            "Specification-Vendor"    : "jaywray",
            "Specification-Version"   : "1",
            "Implementation-Title"    : "greenlantern",
            "Implementation-Version"  : "1.0.0",
            "Implementation-Vendor"   : "jaywray"
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        'mod_version': version
    ]
    inputs.properties(replaceProperties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
