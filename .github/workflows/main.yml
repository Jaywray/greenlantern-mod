plugins {
    id 'net.neoforged.moddev' version '1.0.17'
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.greenlantern'

base {
    archivesName = 'greenlantern'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Configures the official NeoForge development environment parameters natively
neoForge {
    version = "21.1.265"
    parchment {
        mappingsVersion = "2024.07.28"
        minecraftVersion = "1.21"
      }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Core engine hooks handled automatically by the moddev toolchain
}

jar {
    from sourceSets.main.output
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    manifest {
        attributes([
            "Specification-Title"     : "greenlantern",
            "Specification-Vendor"    : "jaywray",
            "Specification-Version"   : "1",
            "Implementation-Title"    : "greenlantern",
            "Implementation-Version"  : "1.0.0",
            "Implementation-Vendor"   : "jaywray"
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        'mod_version': version
    ]
    inputs.properties(replaceProperties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
