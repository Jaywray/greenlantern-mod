name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Desktop Code Files
      run: |
        echo "Extracting mod source files..."
        unzip -q "GreenLanternMod (5).zip" -d temp_extraction
        
        echo "Moving files out of the nested archive folder to root level..."
        mv temp_extraction/*/.??* temp_extraction/*/* . 2>/dev/null || true
        rm -rf temp_extraction

    - name: Purge Hardcoded Local Dependencies
      run: |
        echo "Locating and wiping any hardcoded local path declarations..."
        sed -i '/curseforge/d' build.gradle 2>/dev/null || true
        sed -i '/D:/d' build.gradle 2>/dev/null || true

    - name: Inject NeoForge Automated Toolchain
      run: |
        echo "Injecting the official NeoForge development plugin..."
        sed -i 's/id '\''java'\''/id '\''net.neoforged.moddev'\'' version '\''1.0.17'\''/' build.gradle
        
        echo "Injecting required neoForm configuration blocks..."
        # This appends the exact 1.21.1 environment layout expected by ModDevGradle
        cat << 'EOF' >> build.gradle

        neoForge {
            version = "21.1.65"
            parchment {
                mappingsVersion = "2024.07.28"
                minecraftVersion = "1.21"
            }
        }
        EOF
        
        echo "=== Verifying Your Cleaned Build Architecture ==="
        cat build.gradle
        echo "================================================="

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradle wrapper missing or outdated. Generating Gradle 8.8..."
          gradle wrapper --gradle-version 8.8
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
