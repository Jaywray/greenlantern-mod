name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract and Configure Desktop Code Workspace
      run: |
        echo "Extracting mod source files into separate workspace directory..."
        unzip -q "GreenLanternMod (5).zip" -d extracted_mod
        
        TARGET_DIR=$(find extracted_mod -name "build.gradle" -exec dirname {} \;)
        echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
        
        echo "Overwriting subfolder build.gradle with our corrected GitHub setup..."
        cp build.gradle "$TARGET_DIR/build.gradle"
        
        echo "Injecting the official NeoForge development plugin directly into the project path..."
        sed -i 's/id '\''java'\''/id '\''net.neoforged.moddev'\'' version '\''1.0.17'\''/' "$TARGET_DIR/build.gradle"
        
        echo "Injecting required neoForm configuration blocks directly into the project path..."
        cat << 'EOF' >> "$TARGET_DIR/build.gradle"

        neoForge {
            version = "21.1.65"
            parchment {
                mappingsVersion = "2024.07.28"
                minecraftVersion = "1.21"
            }
        }
        EOF

    - name: Sanitize Data Layer Registries
      run: |
        echo "Scanning for empty or unmapped data registry objects..."
        # If your data pack elements contain incomplete references, this ensures stable structural mapping
        find "${{ env.PROJECT_DIR }}" -type f -name "*.json" -path "*/data/*" -exec sed -i 's/"values":\s*\[\s*\]/"values": \["minecraft:air"\]/g' {} + 2>/dev/null || true

    - name: Ensure Gradle Wrapper Exists
      run: |
        cd "${{ env.PROJECT_DIR }}"
        if [ ! -f ./gradlew ]; then
          echo "Generating Gradle 8.8 Wrapper inside the project folder..."
          gradle wrapper --gradle-version 8.8
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
