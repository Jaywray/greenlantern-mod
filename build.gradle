plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.greenlantern'

base {
    archivesName = 'greenlantern'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { name = "NeoForge"; url = "https://neoforged.net" }
}

dependencies {
    // This brings in both NeoForge and core Minecraft classes for compilation
    compileOnly "net.neoforged:neoforge:21.1.0"
}

jar {
    from sourceSets.main.output
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
