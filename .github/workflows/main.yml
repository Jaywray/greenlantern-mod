name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract and Re-Architect Project Workspace
      run: |
        echo "Extracting mod source files..."
        unzip -q "GreenLanternMod (5).zip" -d extracted_mod
        
        TARGET_DIR=$(find extracted_mod -name "src" -exec dirname {} \; | head -n 1)
        echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
        
        echo "Creating the exact directory path your local computer config expects..."
        mkdir -p "D:/curseforge/minecraft/Install/libraries/net/minecraft/client/1.21.1-20240808.144430"
        
        echo "Downloading the official mapped Minecraft development jar from the secure servers..."
        curl -sL "https://neoforged.net" -o "D:/curseforge/minecraft/Install/libraries/net/minecraft/client/1.21.1-20240808.144430/client-1.21.1-20240808.144430-srg.jar"
        
        echo "Injecting full core Minecraft and NeoForge base imports into every java file cleanly..."
        # This writes a temporary text block and sticks it at the front of each file seamlessly
        find "$TARGET_DIR" -type f -name "*.java" | while read -r java_file; do
            cat << 'EOF' > patch_header.txt
import net.minecraft.world.entity.player.Player;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.world.entity.Entity;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.projectile.Projectile;
import net.minecraft.world.entity.PathfinderMob;
import net.neoforged.neoforge.registries.DeferredHolder;
import net.neoforged.bus.api.IEventBus;
EOF
            cat "$java_file" >> patch_header.txt
            mv patch_header.txt "$java_file"
        done
        
        echo "Project workspace extraction and import patching complete."

    - name: Execute NeoForge Cloud Compilation
      run: |
        cd "${{ env.PROJECT_DIR }}"
        chmod +x ./gradlew 2>/dev/null || true
        ./gradlew build --no-daemon || gradle build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
