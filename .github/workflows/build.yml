name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract and Re-Architect Mod Workspace
      run: |
        echo "Extracting production mod binaries..."
        unzip -q "GreenLanternMod (5).zip" -d raw_extraction
        
        echo "Locating the true assets and binary root..."
        BINARY_ROOT=$(find raw_extraction -name "META-INF" -exec dirname {} \; | head -n 1)
        echo "Target root discovered at: $BINARY_ROOT"
        
        echo "Creating clear absolute output directory structures..."
        mkdir -p "$GITHUB_WORKSPACE/output_jar/build/libs"
        
        echo "Moving into target binary root and compressing flat package..."
        cd "$BINARY_ROOT"
        zip -r "$GITHUB_WORKSPACE/output_jar/build/libs/greenlantern-1.0.0.jar" ./*
        
        echo "Verification complete."

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
