name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Desktop Code Files
      run: |
        echo "Extracting mod source files..."
        unzip -q "GreenLanternMod (5).zip" -d temp_extraction
        
        echo "Moving files out of the nested archive folder to root level..."
        mv temp_extraction/*/.??* temp_extraction/*/* . 2>/dev/null || true
        rm -rf temp_extraction

    - name: Purge Hardcoded Local Dependencies
      run: |
        echo "Locating and wiping any hardcoded local path declarations..."
        sed -i '/curseforge/d' build.gradle 2>/dev/null || true
        sed -i '/D:/d' build.gradle 2>/dev/null || true

    # FORCE INJECT REPOSITORIES AND ENDPOINTS FOR MINECRAFT AND NEOFORGE
    - name: Inject NeoForge Engine Architecture
      run: |
        echo "Injecting official NeoForge and Mojang maven servers..."
        sed -i '/repositories {/a \    maven { url = "https://neoforged.net" }\n    maven { url = "https://minecraft.net" }' build.gradle
        
        echo "Injecting NeoForge 1.21.1 Core API compilation libraries..."
        sed -i '/dependencies {/a \    implementation "net.neoforged:neoforge:21.1.65"\n    compileOnly "org.joml:joml:1.10.5"' build.gradle
        
        echo "=== Verifying Injected build.gradle Structure ==="
        cat build.gradle
        echo "================================================"

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradle wrapper missing. Generating default wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
