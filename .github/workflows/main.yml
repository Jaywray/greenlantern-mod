name: Build Minecraft Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # FIXED: Automatically scans your entire repository to locate your gradlew file, completely bypassing any folder spelling mistakes
      - name: Locate and Compile Mod with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: Could not find gradlew anywhere in the repository!"
            exit 1
          fi
          MOD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project folder at: $MOD_DIR"
          cd "$MOD_DIR"
          chmod +x gradlew || true
          ./gradlew clean build --no-daemon

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Playable-Mod-Jar
          path: "**/build/libs/*.jar"
