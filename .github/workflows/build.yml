name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches dependencies to speed up future runs

    - name: Extract Project Workspace
      run: |
        echo "Extracting mod source files..."
        unzip -q "GreenLanternMod (5).zip" -d extracted_mod
        
        TARGET_DIR=$(find extracted_mod -name "src" -exec dirname {} \; | head -n 1)
        echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

    - name: Execute NeoForge Cloud Compilation
      run: |
        cd "${{ env.PROJECT_DIR }}"
        chmod +x ./gradlew 2>/dev/null || true
        ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: "**/build/libs/*.jar"
        if-no-files-found: error
