plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.greenlantern'

base {
    archivesName = 'greenlantern'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Basic structural compilation bridges bypassing complex plugin locks
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        'mod_version': version
    ]
    inputs.properties(replaceProperties)

    // Safely expands properties only in the metadata file without corrupting item/block models
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
