name: NeoForge Mod Compilation Track

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches dependencies to speed up future runs

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    - name: Execute NeoForge Cloud Compilation
      run: ./gradlew build --no-daemon

    - name: Archive Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GreenLantern-Mod-1.21.1
        path: build/libs/*.jar
        if-no-files-found: error
