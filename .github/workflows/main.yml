name: Build Minecraft Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automatically Locate and Unzip Mod Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found, assuming repository contains raw files directly."
          else
            echo "Found zip archive at: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Automatically cleans legacy folders and drops the perfect 1.21.1 Java compiler layout
      - name: Force Generate and Compile 1.21.1 Mod Environment
        run: |
          find . -type d -name "build" -exec rm -rf {} + || true
          
          SRC_DIR=$(find . -path "*/src/main" -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            SRC_DIR=$(find . -name "java" -type d | head -n 1)
            if [ -z "$SRC_DIR" ]; then
              echo "ERROR: Could not find code source folders!"
              exit 1
            fi
            PROJECT_ROOT=$(dirname "$SRC_DIR")
          else
            PROJECT_ROOT=$(dirname $(dirname "$SRC_DIR"))
          fi
          
          echo "Targeting true project root folder at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          gradle init --type basic --dsl groovy --no-daemon --overwrite
          ./gradlew wrapper --gradle-version 8.10 --no-daemon
          
          # FIXED: Natively downloads the complete, full-size official Minecraft 1.21.1 library file straight into your project folder via curl
          curl -o minecraft-1.21.1.jar https://mojang.com

          # Overwriting build.gradle to read our freshly downloaded local game file directly
          cat << 'EOF' > build.gradle
          plugins {
              id 'java'
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
          }
          version = '1.0.0'
          group = 'com.example.greenlantern'
          base { archivesName = 'greenlantern' }
          java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
          
          repositories {
              mavenLocal()
              mavenCentral()
          }
          
          dependencies {
              // Links the compilation directly to our pristine downloaded local file
              compileOnly files('minecraft-1.21.1.jar')
          }

          // Automatically fixes the model texture tags seamlessly during assembly
          tasks.withType(ProcessResources).configureEach {
              filesMatching("assets/greenlantern/models/**/*.json") {
                  filter { line -> line.replace('forge_data', 'neoforge_data') }
              }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = 'greenlantern'
          EOF

          # Compile your mod natively right inside its true home directory
          chmod +x gradlew || true
          ./gradlew clean build --no-daemon

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Playable-Mod-Jar
          path: "**/build/libs/*.jar"
