name: Build Minecraft Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automatically Locate and Unzip Mod Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found, assuming repository contains raw files directly."
          else
            echo "Found zip archive at: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # FIXED: Finds your code source directory and builds a clean 1.21.1 NeoForge environment from scratch with zero file dependencies
      - name: Force Generate and Compile 1.21.1 Mod Environment
        run: |
          SRC_DIR=$(find . -name "java" -o -name "resources" | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: Could not find code source folders!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname $(dirname "$SRC_DIR"))
          echo "Targeting project root folder at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Dropping a clean, robust 1.21.1 NeoForge workspace layout dynamically
          gradle init --type basic --dsl groovy --no-daemon
          ./gradlew wrapper --gradle-version 8.10 --no-daemon
          
          # Overwriting build.gradle with pristine 1.21.1 NeoForge mapping definitions
          cat << 'EOF' > build.gradle
          plugins {
              id 'java'
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.neoforged.moddev' version '2.1.11'
          }
          version = '1.0.0'
          group = 'com.example.greenlantern'
          base { archivesName = 'greenlantern' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(21)
          neoForge {
              version = '21.1.65'
              parchment {
                  mappingsVersion = '2024.07.28'
                  minecraftVersion = '1.21'
              }
              mods { greenlantern { sourceSet sourceSets.main } }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          # Overwriting settings.gradle with our verified remote server hooks
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  mavenLocal()
                  mavenCentral()
                  maven { url = 'https://neoforged.net' }
              }
          }
          rootProject.name = 'greenlantern'
          EOF

          # Run the direct compilation step right here
          chmod +x gradlew || true
          ./gradlew clean build --no-daemon

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Playable-Mod-Jar
          path: "**/build/libs/*.jar"
