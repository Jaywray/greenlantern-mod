plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.1.13'
}

version = '1.0.0'
group = 'com.example.greenlantern'

base {
    archivesName = 'greenlantern'
}

neoForm {
    version = "1.21.1-20240808.144430"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // This tells the ModDev plugin to actively load NeoForge/Minecraft classes directly into the compile classpath
    implementation "net.neoforged:neoforge:21.1.0"
}

jar {
    from sourceSets.main.output
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
